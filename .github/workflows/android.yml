name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 needs Node 22.22+ or 24.15+
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build web app and copy it into the Android project
        run: |
          npm ci
          npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Stable download link: the "android-latest" release always holds the
      # APK of the latest master commit.
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk chess.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest chess.apk \
            --target "$GITHUB_SHA" \
            --title "Android (latest master)" \
            --notes "Debug APK built from ${GITHUB_SHA::7}." \
            --prerelease
