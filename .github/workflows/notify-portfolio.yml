name: Notify portfolio

on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio deploy
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/alexis-dl/portfolio/dispatches \
            -d '{"event_type":"submodule-updated"}'
