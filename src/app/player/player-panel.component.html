<div class="player" *ngIf="player" [class.active]="active">
  <img
    class="avatar"
    [src]="
      player.profilePicture || 'assets/pictures/default-profile-picture.jpg'
    "
    alt="" />
  <div class="identity">
    <div class="name-line">
      <span class="turn-dot" aria-hidden="true"></span>
      <span class="name">{{ player.name }}</span>
      <span class="elo" *ngIf="player.elo">{{ player.elo }}</span>
      <span class="status" *ngIf="active && status">{{ status }}</span>
    </div>
    <div class="material">
      <img
        *ngFor="let piece of captured"
        class="captured"
        [src]="pieceImage(piece)"
        [alt]="piece" />
      <span class="advantage" *ngIf="advantage > 0">+{{ advantage }}</span>
    </div>
  </div>
</div>
