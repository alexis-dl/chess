<div class="explorer">
  <main class="board-area">
    <app-chess-board
      [chessBoard]="chessBoard"
    [orientation]="orientation"></app-chess-board>
  </main>

  <section class="panel side-panel">
    <header class="info-header">
      <mat-icon class="info-icon">travel_explore</mat-icon>
      <div>
        <h1 class="info-title">{{ 'explorer.title' | t }}</h1>
        <p class="info-subtitle">{{ 'explorer.description' | t }}</p>
      </div>
    </header>

    <div class="opening">
      @if (opening) {
        <app-opening-label [opening]="opening"></app-opening-label>
      }
    </div>

    <app-move-list
      [moves]="moves"
      [currentPly]="ply"
      [selectable]="true"
      (plySelected)="goToPly($event)">
      {{ 'explorer.empty' | t }}
    </app-move-list>

    @if (result) {
      <div class="result">
        <span class="result-title">{{ result.title | t }}</span>
        <span class="result-detail">{{ result.detail | t }}</span>
      </div>
    }

    <div class="navigation">
      <button
        type="button"
        class="btn btn-icon"
        [title]="'moves.first' | t"
        [attr.aria-label]="'moves.first' | t"
        [disabled]="ply === 0"
        (click)="goToPly(0)">
        <mat-icon>first_page</mat-icon>
      </button>
      <button
        type="button"
        class="btn btn-icon"
        [title]="'moves.previous' | t"
        [attr.aria-label]="'moves.previous' | t"
        [disabled]="ply === 0"
        (click)="goToPly(ply - 1)">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button
        type="button"
        class="btn btn-icon"
        [title]="'moves.next' | t"
        [attr.aria-label]="'moves.next' | t"
        [disabled]="ply === line.length"
        (click)="goToPly(ply + 1)">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button
        type="button"
        class="btn btn-icon"
        [title]="'moves.last' | t"
        [attr.aria-label]="'moves.last' | t"
        [disabled]="ply === line.length"
        (click)="goToPly(line.length)">
        <mat-icon>last_page</mat-icon>
      </button>
    </div>

    <div class="controls">
      <button
        type="button"
        class="btn btn-icon"
        [title]="'explorer.flip' | t"
        [attr.aria-label]="'explorer.flip' | t"
        (click)="flip()">
        <mat-icon>swap_vert</mat-icon>
      </button>
      <button
        type="button"
        class="btn"
        [disabled]="!line.length"
        (click)="reset()">
        <mat-icon>refresh</mat-icon>
        {{ 'explorer.reset' | t }}
      </button>
    </div>
  </section>
</div>
