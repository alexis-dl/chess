<header class="topbar">
  <a class="brand" routerLink="/play">
    <span class="brand-icon" aria-hidden="true">♞</span>
    <span class="brand-name">chess</span>
  </a>

  <nav class="nav">
    <a routerLink="/play" routerLinkActive="active">{{ 'nav.play' | t }}</a>
    <a routerLink="/puzzles" routerLinkActive="active">{{
      'nav.puzzles' | t
    }}</a>

    <div
      class="nav-menu"
      #learnMenu
      (mouseenter)="openLearn()"
      (mouseleave)="closeLearn()"
      (focusin)="openLearn()"
      (focusout)="onLearnFocusOut($event)">
      <a
        routerLink="/learn/opening"
        [class.active]="isLearnActive"
        aria-haspopup="true"
        [attr.aria-expanded]="learnOpen"
        (click)="closeLearn()">
        {{ 'nav.learn' | t }}
      </a>
      @if (learnOpen) {
        <div class="dropdown">
          <div class="dropdown-panel">
            @for (section of learnSections; track section) {
              <a
                [routerLink]="['/learn', section.id]"
                routerLinkActive="current"
                (click)="closeLearn()">
                {{ section.title | localize }}
              </a>
            }
          </div>
        </div>
      }
    </div>

    <a routerLink="/analysis" routerLinkActive="active">{{
      'nav.analysis' | t
    }}</a>
    <a class="settings-link" routerLink="/settings" routerLinkActive="active">{{
      'nav.settings' | t
    }}</a>
  </nav>

  <app-settings-slidemenu class="menu"></app-settings-slidemenu>
</header>

<router-outlet></router-outlet>
