<header class="topbar">
  <a class="brand" routerLink="/play">
    <span class="brand-icon" aria-hidden="true">♞</span>
    <span class="brand-name">chess</span>
  </a>

  <nav class="nav">
    <a routerLink="/play" routerLinkActive="active">{{ 'nav.play' | t }}</a>
    <ng-container
      *ngTemplateOutlet="dropdown; context: { $implicit: puzzlesMenu }"></ng-container>
    <ng-container
      *ngTemplateOutlet="dropdown; context: { $implicit: learnMenu }"></ng-container>
    <ng-container
      *ngTemplateOutlet="dropdown; context: { $implicit: statsMenu }"></ng-container>

    <a routerLink="/analysis" routerLinkActive="active">{{
      'nav.analysis' | t
    }}</a>
    <a class="settings-link" routerLink="/settings" routerLinkActive="active">{{
      'nav.settings' | t
    }}</a>
  </nav>

  <app-settings-slidemenu class="menu"></app-settings-slidemenu>
</header>

<router-outlet></router-outlet>

<!-- a top-bar entry and its dropdown of sub-pages -->
<ng-template #dropdown let-menu>
  <div
    class="nav-menu"
    #menuElement
    (mouseenter)="open(menu)"
    (mouseleave)="close()"
    (focusin)="open(menu)"
    (focusout)="onFocusOut($event, menuElement)">
    <a
      [routerLink]="menu.link"
      [class.active]="isActive(menu)"
      aria-haspopup="true"
      [attr.aria-expanded]="openMenu === menu.id"
      (click)="close()">
      {{ menu.key | t }}
    </a>
    @if (openMenu === menu.id) {
      <div class="dropdown">
        <div class="dropdown-panel">
          @for (item of menu.items; track item.link.join('/')) {
            <a
              [routerLink]="item.link"
              routerLinkActive="current"
              (click)="close()">
              {{ item.key ? (item.key | t) : (item.title | localize) }}
            </a>
          }
        </div>
      </div>
    }
  </div>
</ng-template>
