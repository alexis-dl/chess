<button
  mat-icon-button
  class="example-icon"
  [attr.aria-label]="'nav.settings' | t"
  [matMenuTriggerFor]="menu">
  <mat-icon>settings</mat-icon>
</button>
<mat-menu #menu="matMenu">
  <a mat-menu-item *ngFor="let item of items" [routerLink]="item.path">
    <mat-icon>{{ item.icon }}</mat-icon>
    <span>{{ item.label | t }}</span>
  </a>
</mat-menu>
