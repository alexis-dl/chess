<div
  class="container"
  role="radiogroup"
  [attr.aria-label]="'settings.tabs.languages' | t">
  @for (option of languages; track option.language) {
    <button
      type="button"
      class="btn"
      role="radio"
      [attr.lang]="option.language"
      [class.btn-primary]="i18n.language === option.language"
      [attr.aria-checked]="i18n.language === option.language"
      (click)="i18n.setLanguage(option.language)">
      <img [src]="'assets/flags/4x3/' + option.flag + '.svg'" alt="" />
      {{ option.name }}
    </button>
  }
</div>
