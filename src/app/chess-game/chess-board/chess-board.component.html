<div class="board" cdkDropListGroup>
  <div
    *ngFor="let square of squares; trackBy: trackByIndex"
    class="square"
    [class.light]="square.isLight"
    [class.dark]="!square.isLight"
    [class.last-move]="square.isLastMove"
    [class.check]="square.isCheck"
    [class.selected]="isSelected(square)"
    [class.target]="isTarget(square)"
    [class.occupied]="square.piece"
    cdkDropList
    cdkDropListSortingDisabled
    [cdkDropListData]="square"
    (cdkDropListDropped)="onDrop($event)"
    (click)="onSquareClick(square)">
    <span class="coord rank" *ngIf="square.rankLabel">{{
      square.rankLabel
    }}</span>
    <span class="coord file" *ngIf="square.fileLabel">{{
      square.fileLabel
    }}</span>

    <app-chess-piece
      *ngIf="square.piece"
      [pieceType]="square.piece"
      [class.draggable]="canDrag(square)"
      cdkDrag
      cdkDragBoundary=".board"
      [cdkDragData]="square"
      [cdkDragDisabled]="!canDrag(square)"
      (mousedown)="select(square)"
      (touchstart)="select(square)"></app-chess-piece>

    <app-promotion
      *ngIf="showPromotion(square)"
      [pieceColor]="promotionColor(square)"></app-promotion>
  </div>
</div>
