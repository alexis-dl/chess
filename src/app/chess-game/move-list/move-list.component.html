<div class="moves" #list>
  @for (row of rows; track row) {
    <div class="move-row">
      <span class="move-number">{{ row.number }}</span>
      @for (ply of row.plies; track ply) {
        <button
          type="button"
          class="move"
          [class.current]="ply === currentPly"
          [class.selectable]="selectable"
          [disabled]="!selectable"
          (click)="select(ply)">
          {{ moves[ply - 1] }}
        </button>
      }
    </div>
  }
  @if (!moves.length) {
    <div class="moves-empty">
      <ng-content></ng-content>
    </div>
  }
</div>
