<div
  class="picker"
  [class.upward]="upward"
  appClickOutside
  (clickOutside)="onCancel()">
  <button
    *ngFor="let piece of pieces"
    type="button"
    class="option"
    [attr.aria-label]="
      'board.promoteTo' | t: { piece: (pieceNameKey(piece) | t) }
    "
    (click)="onSelect(piece)">
    <img [src]="getPieceImagePath(piece)" alt="" />
  </button>
  <button
    type="button"
    class="cancel"
    [attr.aria-label]="'board.cancelPromotion' | t"
    (click)="onCancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>
