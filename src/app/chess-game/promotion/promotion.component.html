<div
  class="picker"
  [class.upward]="upward"
  appClickOutside
  (clickOutside)="onCancel()">
  <button
    *ngFor="let piece of pieces"
    type="button"
    class="option"
    [attr.aria-label]="'Promote to ' + piece"
    (click)="onSelect(piece)">
    <img [src]="getPieceImagePath(piece)" [alt]="piece" />
  </button>
  <button
    type="button"
    class="cancel"
    aria-label="Cancel promotion"
    (click)="onCancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>
